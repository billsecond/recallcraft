[package]
name = "recallcraft-calls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Knowing when a call is on: which programs are using a microphone, which of them are calling apps, and the meeting's title from their windows"

[lints]
workspace = true

[dependencies]
log = { workspace = true }

# Windows: the programs with a microphone open (WASAPI's audio sessions), every program and its
# parent (a tool-help snapshot), and their windows' titles, through safe bindings.
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = { workspace = true }
winsafe = { workspace = true, features = ["kernel", "user"] }
