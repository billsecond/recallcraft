name: Package

# Builds every release file with the scripts in packaging/ and uploads them as workflow artifacts
# named release-* (release.yml gathers them into one GitHub release). Called by release.yml; it
# doesn't run on its own. Everything here runs on GitHub's standard runners, so it works in any
# repository, a fork included.
#
# File names follow the Craft apps' releases, which is what lets ArtCraft Launcher find them:
#   recallcraft-<ver>-windows-{x64,x86,arm64}.msi, recallcraft-<ver>-windows-{x64,x86,arm64}-portable.zip
#   recallcraft-<ver>-macos-universal.dmg, recallcraft-cli-<ver>-macos-universal.zip
#   recallcraft-<ver>-linux-{x86_64,aarch64}.{AppImage,AppImage.zsync,deb,rpm,tar.gz,flatpak}
#   recallcraft-<ver>-freebsd-x86_64.tar.gz
# Every package carries the speech model (assets/models) where the programs look for it.

on:
  workflow_call:
    inputs:
      freebsd:
        description: "Also build the FreeBSD tarball (in a VM; slow)"
        type: boolean
        required: false
        default: true
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SIGNING_ENDPOINT:
        required: false
      AZURE_SIGNING_ACCOUNT:
        required: false
      AZURE_CERT_PROFILE:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  WIX_VERSION: "5.0.2"
  NFPM_VERSION: "2.47.0"

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-windows-${{ matrix.arch }}
      - name: Install WiX and its dialog and utility extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION" "WixToolset.Util.wixext/$env:WIX_VERSION"
      - name: Build, sign and package (MSI and portable zip)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      # The installer for real, on the one architecture this runner is: files and the model in
      # place, the program listed, the sign-in entry the installing user's own (never HKLM: it
      # would start a recorder for everyone on the PC), the command-line program answering; then
      # RecallCraft started the way a sign-in starts it, and an uninstall that must close it
      # (supervisor included) and leave nothing behind.
      - name: Install, check and uninstall the MSI (x64 only)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $msi = (Get-Item dist/release/*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "$env:RUNNER_TEMP\install.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 60; throw "install failed ($($p.ExitCode))" }
          $dir = Join-Path $env:ProgramFiles 'RecallCraft'
          foreach ($f in 'recallcraft.exe', 'recallcraft-cli.exe', 'models\whisper-base.en-q8_0.gguf', 'models\LICENSE-WHISPER.txt', 'models\README.md') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f missing in $dir" }
          }
          & (Join-Path $dir 'recallcraft-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "recallcraft-cli --version exited $LASTEXITCODE" }
          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -eq 'RecallCraft' }
          if (-not $entry) { throw 'no installed-programs entry named RecallCraft' }
          $entry | Format-List DisplayName, DisplayVersion, Publisher, PSChildName
          $userRun = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
          $machineRun = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
          $expected = "`"$dir\recallcraft.exe`" --background"
          $run = (Get-ItemProperty $userRun -ErrorAction SilentlyContinue).RecallCraft
          if ($run -ne $expected) { throw "sign-in entry is '$run', expected '$expected'" }
          if ((Get-ItemProperty $machineRun -ErrorAction SilentlyContinue).RecallCraft) { throw 'the install wrote a sign-in entry for everyone (HKLM)' }
          $app = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\recallcraft.exe').'(default)'
          if ($app -ne "$dir\recallcraft.exe") { throw "App Paths entry is '$app', expected '$dir\recallcraft.exe'" }

          $env:RECALLCRAFT_NO_PREFS = '1'
          Start-Process (Join-Path $dir 'recallcraft.exe') -ArgumentList '--background'
          Start-Sleep -Seconds 5
          Get-Process recallcraft -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, StartTime
          $p = Start-Process msiexec.exe -ArgumentList @('/x', $entry.PSChildName, '/qn', '/norestart', '/l*v', "$env:RUNNER_TEMP\uninstall.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\uninstall.log" -Tail 60; throw "uninstall failed ($($p.ExitCode))" }
          if (Get-Process recallcraft -ErrorAction SilentlyContinue) { throw 'RecallCraft is still running after uninstall' }
          if (Test-Path (Join-Path $dir 'recallcraft.exe')) { throw 'uninstall left recallcraft.exe behind' }
          if (Test-Path (Join-Path $dir 'models')) { throw 'uninstall left the model behind' }
          if ((Get-ItemProperty $userRun -ErrorAction SilentlyContinue).RecallCraft) { throw 'uninstall left the sign-in entry behind' }
          if ((Get-ItemProperty 'HKCU:\SOFTWARE\RecallCraft\Installer' -ErrorAction SilentlyContinue).StartAtSignIn) { throw "uninstall left the installer's own value behind" }
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\recallcraft.exe') { throw 'uninstall left App Paths behind' }
      # The same installer just for one person (ALLUSERS=2 MSIINSTALLPERUSER=1, what "Just for me"
      # passes): everything in the runner user's LocalAppData, Start menu and HKCU, nothing in
      # Program Files or HKLM, and Windows Installer running it with the user's privileges, not
      # elevated; then RecallCraft started and closed again by the uninstall, which leaves nothing
      # behind. (The runner is an administrator, so a UAC prompt can't be seen here: what is
      # checked is that the install used nothing only an administrator has.)
      - name: Install, check and uninstall the MSI just for one user (x64 only)
        if: matrix.arch == 'x64'
        # Reported, not yet a gate: where Windows Installer records a single user's install is
        # still being learnt from these runs (as for ScreenGrabCraft). The install for everyone
        # above is the gate.
        continue-on-error: true
        shell: pwsh
        run: |
          $msi = (Get-Item dist/release/*.msi).FullName
          $log = "$env:RUNNER_TEMP\install-user.log"
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", 'ALLUSERS=2', 'MSIINSTALLPERUSER=1', '/qn', '/norestart', '/l*v', $log) -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "per-user install failed ($($p.ExitCode))" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\RecallCraft'
          foreach ($f in 'recallcraft.exe', 'recallcraft-cli.exe', 'models\whisper-base.en-q8_0.gguf', 'models\LICENSE-WHISPER.txt', 'models\README.md') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f missing in $dir" }
          }
          if (Test-Path (Join-Path $env:ProgramFiles 'RecallCraft')) { throw 'the per-user install wrote to Program Files' }
          & (Join-Path $dir 'recallcraft-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "recallcraft-cli --version exited $LASTEXITCODE" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'RecallCraft.lnk'
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut $lnk" }
          # Windows Installer keeps a single user's products under HKCU\Software\Microsoft\Installer
          # (not the Uninstall key, which is for everyone's).
          $entry = Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Installer\Products\*' -ErrorAction SilentlyContinue | Where-Object { $_.ProductName -eq 'RecallCraft' }
          if (-not $entry) { throw 'RecallCraft is not registered as installed for this user' }
          $entry | Format-List ProductName, PSChildName
          # Shown, not judged: Programs and Features' own records of it.
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'RecallCraft' } | Format-List DisplayName, DisplayVersion, InstallLocation, PSChildName
          $expected = "`"$dir\recallcraft.exe`" --background"
          $run = (Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).RecallCraft
          if ($run -ne $expected) { throw "per-user sign-in entry is '$run', expected '$expected'" }
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).RecallCraft) { throw 'the per-user install wrote the sign-in entry for everyone' }
          $app = (Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\recallcraft.exe').'(default)'
          if ($app -ne "$dir\recallcraft.exe") { throw "per-user App Paths entry is '$app', expected '$dir\recallcraft.exe'" }
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\recallcraft.exe') { throw 'the per-user install wrote App Paths for everyone' }
          # Windows Installer logs how it ran the product: an install for everyone is "assigned"
          # and runs with elevated privileges, one for a single user with that user's.
          Select-String -Path $log -Pattern 'Running product' | ForEach-Object { $_.Line }
          if (Select-String -Path $log -Pattern 'with elevated privileges' -Quiet) { throw 'the per-user install ran with elevated privileges' }

          $env:RECALLCRAFT_NO_PREFS = '1'
          Start-Process (Join-Path $dir 'recallcraft.exe') -ArgumentList '--background'
          Start-Sleep -Seconds 5
          Get-Process recallcraft -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, Path
          # Removed by its package, in its scope (a user's product has no code under the Uninstall key).
          $p = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", 'ALLUSERS=2', 'MSIINSTALLPERUSER=1', '/qn', '/norestart', '/l*v', "$env:RUNNER_TEMP\uninstall-user.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\uninstall-user.log" -Tail 60; throw "per-user uninstall failed ($($p.ExitCode))" }
          if (Get-Process recallcraft -ErrorAction SilentlyContinue) { throw 'RecallCraft is still running after the per-user uninstall' }
          if (Test-Path (Join-Path $dir 'recallcraft.exe')) { throw 'the per-user uninstall left recallcraft.exe behind' }
          if ((Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).RecallCraft) { throw 'the per-user uninstall left the sign-in entry behind' }
          if (Test-Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\recallcraft.exe') { throw 'the per-user uninstall left App Paths behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-macos-universal
      # With the signing secrets set, the app is signed with the Developer ID and notarized;
      # without them it is ad-hoc signed and the script says so.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then bash packaging/macos/import-cert.sh; else echo "no signing certificate: ad-hoc signing"; fi
      - name: Build, sign and package (the .app in a .dmg, CLI zip)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/macos/package.sh --arch universal
      - name: Check the .dmg
        run: |
          dmg=$(ls dist/release/*-macos-universal.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          [ -L "$mnt/Applications" ] || { echo "::error::no Applications link in the image"; hdiutil detach "$mnt"; exit 1; }
          app="$mnt/RecallCraft.app"
          # The app as somebody gets it: the signature holds for the copy in the image too.
          # When it doesn't, say what the image attached to which file.
          if ! codesign --verify --deep --strict --verbose=4 "$app"; then
            echo "::group::What is attached to the files in the image"
            xattr -lr "$app" || true
            ls -laO@ "$mnt" "$app" "$app/Contents" "$app/Contents/MacOS" "$app/Contents/Resources" || true
            echo "::endgroup::"
            hdiutil detach "$mnt" || true
            exit 1
          fi
          plutil -p "$app/Contents/Info.plist" | grep -E "CFBundleIdentifier|CFBundleIconFile|CFBundleShortVersionString|LSUIElement|NSMicrophoneUsageDescription"
          lipo -info "$app/Contents/MacOS/RecallCraft"
          "$app/Contents/MacOS/RecallCraft" --version
          # The model where the program looks for it.
          for f in whisper-base.en-q8_0.gguf LICENSE-WHISPER.txt README.md; do
            [ -f "$app/Contents/Resources/models/$f" ] || { echo "::error::no Resources/models/$f in the app"; hdiutil detach "$mnt"; exit 1; }
          done
          # A menu-bar app: no Dock icon.
          [ "$(plutil -extract LSUIElement raw -o - "$app/Contents/Info.plist")" = true ] || { echo "::error::RecallCraft.app is not LSUIElement"; hdiutil detach "$mnt"; exit 1; }
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux ${{ matrix.arch }}
    # The oldest supported Ubuntu image: binaries built against its glibc (2.35) run on newer ones.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries and packaging tools
        env:
          DEB_ARCH: ${{ matrix.deb }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev \
            desktop-file-utils appstream zsync file xvfb libxkbcommon-x11-0 libegl1 mesa-vulkan-drivers
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${DEB_ARCH}.deb"
          case "${NFPM_VERSION}:${DEB_ARCH}" in
            2.47.0:amd64) expected=3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97 ;;
            2.47.0:arm64) expected=27419eb382695a7942be8ad52259f3ec1854fad001b3ae4baed34ce39a223b97 ;;
            *) echo "::error::no checksum for nfpm ${NFPM_VERSION} ${DEB_ARCH}"; exit 1 ;;
          esac
          echo "$expected  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-linux-${{ matrix.arch }}
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: bash packaging/linux/package.sh
      # The .deb for real: installed with its dependencies, the entries checked, the window and
      # the service (its tray process, with no tray host, no D-Bus session and no sound devices
      # here) started on a virtual display, and removed again.
      - name: Install, start and remove the .deb
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb
          sudo apt-get install -y ./dist/release/*.deb
          recallcraft-cli --version
          desktop-file-validate /usr/share/applications/io.github.billsecond.recallcraft.desktop \
            /usr/share/recallcraft/autostart/io.github.billsecond.recallcraft.desktop
          test -f /usr/lib/systemd/user/recallcraft.service
          for f in whisper-base.en-q8_0.gguf LICENSE-WHISPER.txt README.md; do
            test -f "/usr/share/recallcraft/models/$f" || { echo "::error::no /usr/share/recallcraft/models/$f"; exit 1; }
          done
          # Starting at sign-in is each person's own (RecallCraft writes it on its first run).
          if [ -e /etc/xdg/autostart/io.github.billsecond.recallcraft.desktop ]; then
            echo "::error::the package starts RecallCraft for every account (/etc/xdg/autostart)"; exit 1
          fi
          # Still running when the time was up (124) is what a program that started looks like.
          stays_up() {
            local what="$1" code=0
            shift
            RECALLCRAFT_NO_PREFS=1 timeout 20 xvfb-run -a "$@" >"$RUNNER_TEMP/$what.log" 2>&1 || code=$?
            if [ "$code" != 124 ]; then
              cat "$RUNNER_TEMP/$what.log"
              echo "::error::$* did not stay up (exit $code)"
              exit 1
            fi
            echo "ok: $* stayed up"
          }
          stays_up window recallcraft --window
          stays_up tray recallcraft --tray
          sudo apt-get purge -y recallcraft
          for f in /usr/bin/recallcraft /usr/bin/recallcraft-cli /usr/share/recallcraft; do
            if [ -e "$f" ]; then echo "::error::removing the package left $f behind"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the Flatpak bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -- dist/linux/recallcraft-*-linux-"$ARCH".tar.gz
          if [ ! -f "$1" ]; then echo "::error::no tar.gz for $ARCH in dist/linux"; exit 1; fi
          bash packaging/linux/flatpak-bundle.sh "$1"
      - uses: actions/upload-artifact@v4
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/release/*.flatpak
          if-no-files-found: error
          retention-days: 30

  freebsd:
    name: FreeBSD x86_64
    if: inputs.freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build and package in a FreeBSD VM
        # A FreeBSD build that fails doesn't hold back the other platforms: the release then has
        # no FreeBSD tarball, and this step shows as failed.
        continue-on-error: true
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          usesh: true
          # A private repository's runner has 2 processors and 7 GB: a bigger VM doesn't start.
          cpu: 2
          mem: 5120
          # alsa-lib: the microphone and playback (cpal's ALSA, over FreeBSD's OSS).
          prepare: |
            pkg install -y bash git curl pkgconf cmake python3 alsa-lib libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader fontconfig freetype2
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          run: |
            set -e
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "*"
            export CARGO_TARGET_DIR=/var/tmp/recallcraft-target CARGO_BUILD_JOBS=2
            bash packaging/freebsd/package.sh
            rm -rf /var/tmp/recallcraft-target
      - uses: actions/upload-artifact@v4
        with:
          name: release-freebsd-x86_64
          path: dist/release/*
          if-no-files-found: warn
          retention-days: 30
